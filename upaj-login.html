<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UPAJ Login</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --g1:#6fdc00; --g2:#2fb800; --g3:#0a9d00; --ink:#12301a; --muted:#6b7f70;
    --err:#e5484d; --card:rgba(255,255,255,.88);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Poppins',system-ui,sans-serif; color:var(--ink);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
    background:linear-gradient(135deg,#eaffd9 0%,#d4f7b4 45%,#b8ec86 100%);
    overflow-x:hidden; position:relative;
  }
  /* ---------- SVG background ---------- */
  .bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  .float1{animation:fl 9s ease-in-out infinite}
  .float2{animation:fl 12s ease-in-out infinite reverse}
  .float3{animation:fl 7s ease-in-out infinite}
  @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}

  /* ---------- Card ---------- */
  .card{
    position:relative; z-index:1; width:100%; max-width:380px;
    background:var(--card); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.9); border-radius:24px;
    padding:26px 26px 22px; box-shadow:0 20px 50px -12px rgba(10,120,0,.35);
    animation:pop .6s cubic-bezier(.2,.9,.3,1.2) both;
  }
  @keyframes pop{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}

  .brand{text-align:center;margin-bottom:16px}
  .brand svg.logo{width:86px;height:86px;display:block;margin:0 auto 4px}
  .brand h1{
    font-size:34px;font-weight:700;letter-spacing:5px; line-height:1;
    background:linear-gradient(180deg,var(--g1),var(--g3)); -webkit-background-clip:text; background-clip:text; color:transparent;
    padding-left:5px;
  }
  .brand p{font-size:9.5px;letter-spacing:2px;font-weight:600;color:#25402b;margin-top:6px;text-transform:uppercase}

  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;font-weight:600;margin-bottom:5px;color:#27432d}
  .input{
    position:relative; display:flex; align-items:center; background:#fff;
    border:1.5px solid #dbe8d6; border-radius:12px; transition:.2s;
  }
  .input:focus-within{border-color:var(--g2);box-shadow:0 0 0 4px rgba(47,184,0,.15)}
  .input.invalid{border-color:var(--err);box-shadow:0 0 0 4px rgba(229,72,77,.12)}
  .input svg.ic{width:18px;height:18px;margin-left:12px;flex:none;stroke:#8aa08f;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .input input{
    flex:1; min-width:0; border:0; outline:0; background:transparent;
    padding:11px 12px; font:500 14px 'Poppins',sans-serif; color:var(--ink);
  }
  .input input::placeholder{color:#a5b5a8;font-weight:400}
  .icon-btn{
    border:0;background:transparent;cursor:pointer;padding:0 12px;height:100%;display:flex;align-items:center;color:#8aa08f;transition:.2s
  }
  .icon-btn:hover{color:var(--g3)}
  .icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .err{font-size:11px;color:var(--err);margin-top:4px;min-height:0;display:none}
  .field.has-error .err{display:block;animation:sh .3s}
  @keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

  /* captcha */
  .captcha{display:flex;gap:8px;align-items:stretch}
  .cap-box{
    flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
    background:linear-gradient(135deg,#f3ffe6,#e2f8c9); border:1.5px dashed #9ad565; border-radius:12px;
    font:700 20px 'Poppins',sans-serif; letter-spacing:3px; color:#1c5a0a; user-select:none; position:relative; overflow:hidden;
  }
  .cap-box::before{
    content:""; position:absolute; inset:0;
    background:repeating-linear-gradient(115deg,transparent 0 9px,rgba(47,184,0,.09) 9px 11px);
  }
  .cap-box span{position:relative;display:inline-block}
  .cap-box span:nth-child(odd){transform:rotate(-6deg) translateY(1px)}
  .cap-box span:nth-child(even){transform:rotate(5deg) translateY(-1px)}
  .refresh{
    width:44px;border:1.5px solid #dbe8d6;background:#fff;border-radius:12px;cursor:pointer;color:var(--g3);transition:.25s;display:grid;place-items:center
  }
  .refresh:hover{background:#f1ffe3;border-color:var(--g2)}
  .refresh svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .5s}
  .refresh.spin svg{transform:rotate(360deg)}
  .cap-input{width:90px;flex:none}
  .cap-input input{text-align:center;padding:11px 6px}

  .row{display:flex;justify-content:space-between;align-items:center;margin:2px 0 14px;font-size:12px}
  .check{display:flex;align-items:center;gap:7px;cursor:pointer;color:#3b5a41;font-weight:500}
  .check input{accent-color:var(--g2);width:15px;height:15px}
  .row a{color:var(--g3);font-weight:600;text-decoration:none}
  .row a:hover{text-decoration:underline}

  .btn{
    width:100%; border:0; cursor:pointer; padding:13px; border-radius:12px; color:#fff;
    font:600 15px 'Poppins',sans-serif; letter-spacing:.5px;
    background:linear-gradient(135deg,var(--g1),var(--g3)); box-shadow:0 10px 22px -8px rgba(10,157,0,.7);
    transition:.2s; display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 14px 26px -8px rgba(10,157,0,.8)}
  .btn:active{transform:translateY(0)}
  .btn[disabled]{opacity:.75;cursor:not-allowed;transform:none}
  .loader{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite;display:none}
  .btn.loading .loader{display:block}
  @keyframes rot{to{transform:rotate(360deg)}}

  .foot{text-align:center;font-size:10.5px;color:var(--muted);margin-top:14px}

  /* ---------- Toasts ---------- */
  #toasts{position:fixed;top:16px;right:16px;z-index:50;display:flex;flex-direction:column;gap:10px;width:min(320px,calc(100vw - 32px))}
  .toast{
    position:relative; overflow:hidden; display:flex; gap:10px; align-items:flex-start;
    background:#fff; border-radius:14px; padding:12px 12px 14px; box-shadow:0 14px 30px -10px rgba(0,0,0,.28);
    border-left:5px solid var(--c); animation:tin .35s cubic-bezier(.2,.9,.3,1.2) both;
  }
  .toast.out{animation:tout .3s ease-in forwards}
  @keyframes tin{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
  @keyframes tout{to{opacity:0;transform:translateX(40px)}}
  .toast .ti{width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;flex:none;font-size:13px;font-weight:700}
  .toast b{display:block;font-size:13px}
  .toast small{font-size:12px;color:#5a6b5e;line-height:1.35;display:block}
  .toast .x{margin-left:auto;border:0;background:none;cursor:pointer;color:#9aa;font-size:16px;line-height:1}
  .toast .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--c);width:100%;animation:bar var(--d) linear forwards}
  @keyframes bar{to{width:0}}
  .toast.success{--c:#2fb800}.toast.error{--c:#e5484d}.toast.info{--c:#2f8cff}.toast.warn{--c:#f5a524}

  @media(max-width:420px){.card{padding:22px 18px 18px}}
</style>
</head>
<body>

<!-- ============ Background SVG shapes ============ -->
<svg class="bg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7be10f" stop-opacity=".55"/><stop offset="1" stop-color="#0a9d00" stop-opacity=".35"/></linearGradient>
    <linearGradient id="bgB" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a6f04a" stop-opacity=".6"/><stop offset="1" stop-color="#2fb800" stop-opacity=".25"/></linearGradient>
  </defs>
  <path class="float1" d="M-80 120C60 -20 300 -40 420 90s60 260-70 330S60 470-80 360Z" fill="url(#bgA)"/>
  <path class="float2" d="M1000 760c120-120 320-140 450-40v200H900c-20-50 20-110 100-160Z" fill="url(#bgB)"/>
  <circle class="float3" cx="1240" cy="170" r="110" fill="url(#bgA)"/>
  <circle class="float2" cx="200" cy="740" r="70" fill="url(#bgB)"/>
  <circle cx="1120" cy="470" r="26" fill="#6fdc00" opacity=".35"/>
  <circle cx="330" cy="470" r="16" fill="#2fb800" opacity=".3"/>
  <path d="M0 800C240 730 420 880 700 810s520-110 740-20V900H0Z" fill="#2fb800" opacity=".14"/>
  <path d="M0 840C260 780 460 900 740 850s500-90 700-10V900H0Z" fill="#0a9d00" opacity=".14"/>
  <g stroke="#2fb800" stroke-opacity=".28" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M90 300l16 0M98 292l0 16"/><path d="M1320 640l16 0M1328 632l0 16"/><path d="M640 90l16 0M648 82l0 16"/>
  </g>
  <g fill="#2fb800" opacity=".18">
    <rect x="1280" y="330" width="46" height="46" rx="12" transform="rotate(20 1303 353)"/>
    <rect x="120" y="520" width="38" height="38" rx="10" transform="rotate(-18 139 539)"/>
  </g>
</svg>

<div id="toasts" aria-live="polite"></div>

<main class="card">
  <div class="brand">
    <!-- UPAJ logo (SVG recreation). To use your original file instead, replace this whole <svg class="logo"> with:
         <img class="logo" src="upaj-logo.png" alt="UPAJ" style="width:86px;height:86px;display:block;margin:0 auto 4px"> -->
    <svg class="logo" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-label="UPAJ logo">
      <defs>
        <linearGradient id="lg" x1="0.2" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#72de00"/><stop offset="1" stop-color="#079a00"/></linearGradient>
        <filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#0a7a00" flood-opacity=".35"/></filter>
      </defs>
      <circle cx="60" cy="58" r="55" fill="#fff" filter="url(#sh)"/>
      <circle cx="60" cy="58" r="49" fill="url(#lg)"/>
      <clipPath id="cc"><circle cx="60" cy="58" r="49"/></clipPath>
      <g clip-path="url(#cc)" fill="#fff">
        <!-- left white shape -->
        <path d="M10 40C20 46 27 52 27 58c1 10 5 17 7 22 1 4 0 8-2 11-6 2-12-1-12-6 0-8-4-14-8-22Z" opacity=".95"/>
        <!-- top sweep -->
        <path d="M44 14C62 14 82 20 96 36c8 9 14 20 14 30l-12 4C84 56 70 40 56 32c-4-3-8-5-12-6Z" opacity=".95"/>
        <!-- right white fingers -->
        <rect x="76" y="46" width="34" height="9" rx="4.5" transform="rotate(32 76 46)"/>
        <rect x="76" y="62" width="34" height="9" rx="4.5" transform="rotate(32 76 62)"/>
        <rect x="80" y="78" width="26" height="9" rx="4.5" transform="rotate(38 80 78)"/>
      </g>
      <!-- central green hand -->
      <g fill="url(#lg)" stroke="#fff" stroke-width="1.6" stroke-linejoin="round">
        <rect x="41" y="34" width="9" height="32" rx="4.5" transform="rotate(-16 45 50)"/>
        <rect x="51" y="30" width="9" height="34" rx="4.5" transform="rotate(-10 55 47)"/>
        <rect x="62" y="32" width="9" height="32" rx="4.5" transform="rotate(14 66 48)"/>
        <rect x="35" y="48" width="8" height="22" rx="4" transform="rotate(-34 39 59)"/>
        <path d="M40 58l10 8 22-4 6-8c1-6 2-10 8-10 3 0 4 2 2 3-3 2-6 4-6 8l4 22c1 6-3 10-8 11H58C46 88 38 78 38 68Z"/>
      </g>
    </svg>
    <h1>UPAJ</h1>
    <p>Ultra Poor Graduation<br>Approach in Jharkhand</p>
  </div>

  <form id="form" novalidate>
    <div class="field" id="f-user">
      <label for="user">Username / Email</label>
      <div class="input">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>
        <input id="user" type="text" placeholder="Enter your username" autocomplete="username">
      </div>
      <div class="err"></div>
    </div>

    <div class="field" id="f-pass">
      <label for="pass">Password</label>
      <div class="input">
        <svg class="ic" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        <input id="pass" type="password" placeholder="Enter your password" autocomplete="current-password">
        <button type="button" class="icon-btn" id="eye" aria-label="Show password">
          <svg viewBox="0 0 24 24" id="eyeSvg"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="err"></div>
    </div>

    <div class="field" id="f-cap">
      <label for="cap">Security Check</label>
      <div class="captcha">
        <div class="cap-box" id="capBox" aria-live="polite"></div>
        <button type="button" class="refresh" id="refresh" aria-label="New captcha">
          <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 6.3"/><path d="M20 4v7h-7"/></svg>
        </button>
        <div class="input cap-input"><input id="cap" type="text" inputmode="numeric" maxlength="3" placeholder="?" autocomplete="off"></div>
      </div>
      <div class="err"></div>
    </div>

    <div class="row">
      <label class="check"><input type="checkbox" id="remember"> Remember me</label>
      <a href="#" id="forgot">Forgot password?</a>
    </div>

    <button class="btn" id="submit" type="submit"><span class="loader"></span><span id="btnTxt">Login</span></button>
  </form>

  <div class="foot">© <span id="yr"></span> UPAJ · All rights reserved</div>
</main>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const form = $('#form'), user = $('#user'), pass = $('#pass'), cap = $('#cap');
  $('#yr').textContent = new Date().getFullYear();

  /* ---------- Toast ---------- */
  function toast(type, title, msg, ms = 3800){
    const icons = {success:'✓', error:'!', info:'i', warn:'!'};
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.style.setProperty('--d', ms + 'ms');
    el.innerHTML = `<div class="ti">${icons[type]}</div><div><b></b><small></small></div><button class="x" aria-label="Close">×</button><div class="bar"></div>`;
    el.querySelector('b').textContent = title;
    el.querySelector('small').textContent = msg;
    const close = () => { el.classList.add('out'); setTimeout(() => el.remove(), 300); };
    el.querySelector('.x').onclick = close;
    $('#toasts').appendChild(el);
    setTimeout(close, ms);
  }

  /* ---------- Math captcha ---------- */
  let answer = 0;
  function newCaptcha(){
    const ops = ['+','−','×'];
    const op = ops[Math.floor(Math.random()*3)];
    let a = 2 + Math.floor(Math.random()*9), b = 1 + Math.floor(Math.random()*9);
    if (op === '−' && b > a) [a,b] = [b,a];
    if (op === '×'){ a = 2 + Math.floor(Math.random()*7); b = 2 + Math.floor(Math.random()*6); }
    answer = op === '+' ? a+b : op === '−' ? a-b : a*b;
    $('#capBox').innerHTML = [a, op, b, '='].map(c => `<span>${c}</span>`).join('') + '<span>?</span>';
    cap.value = '';
  }
  $('#refresh').onclick = e => {
    const b = e.currentTarget; b.classList.add('spin'); setTimeout(() => b.classList.remove('spin'), 500);
    newCaptcha(); clearError('f-cap');
  };
  newCaptcha();

  /* ---------- Show / hide password ---------- */
  $('#eye').onclick = () => {
    const show = pass.type === 'password';
    pass.type = show ? 'text' : 'password';
    $('#eyeSvg').innerHTML = show
      ? '<path d="M3 3l18 18"/><path d="M10.6 6.1A9.8 9.8 0 0 1 12 6c6 0 10 6 10 6a17 17 0 0 1-3.2 3.8M6.5 7.6A17 17 0 0 0 2 12s4 7 10 7a9.6 9.6 0 0 0 4-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>'
      : '<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>';
  };

  /* ---------- Validation ---------- */
  function setError(id, msg){
    const f = document.getElementById(id);
    f.classList.add('has-error'); f.querySelector('.err').textContent = msg;
    f.querySelectorAll('.input').forEach(i => i.classList.add('invalid'));
  }
  function clearError(id){
    const f = document.getElementById(id);
    f.classList.remove('has-error');
    f.querySelectorAll('.input').forEach(i => i.classList.remove('invalid'));
  }
  const rules = {
    'f-user': () => {
      const v = user.value.trim();
      if (!v) return 'Username or email is required';
      if (v.includes('@') && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) return 'Enter a valid email address';
      if (v.length < 3) return 'Must be at least 3 characters';
      return '';
    },
    'f-pass': () => {
      const v = pass.value;
      if (!v) return 'Password is required';
      if (v.length < 6) return 'Password must be at least 6 characters';
      return '';
    },
    'f-cap': () => {
      const v = cap.value.trim();
      if (!v) return 'Solve the captcha';
      if (!/^-?\d+$/.test(v)) return 'Enter numbers only';
      if (Number(v) !== answer) return 'Wrong answer, try again';
      return '';
    }
  };
  const inputs = {'f-user':user, 'f-pass':pass, 'f-cap':cap};
  Object.entries(inputs).forEach(([id, el]) => {
    el.addEventListener('input', () => clearError(id));
    el.addEventListener('blur', () => { if (el.value) { const m = rules[id](); m ? setError(id, m) : clearError(id); } });
  });

  /* ---------- Submit ---------- */
  form.addEventListener('submit', async e => {
    e.preventDefault();
    let firstBad = null, capFailed = false;
    for (const id in rules){
      const m = rules[id]();
      if (m){ setError(id, m); firstBad = firstBad || inputs[id]; if (id === 'f-cap' && cap.value.trim()) capFailed = true; }
      else clearError(id);
    }
    if (firstBad){
      toast('error', 'Check your details', 'Please fix the highlighted fields.');
      if (capFailed) newCaptcha();
      firstBad.focus();
      return;
    }

    const btn = $('#submit');
    btn.disabled = true; btn.classList.add('loading'); $('#btnTxt').textContent = 'Signing in...';
    try {
      /* TODO: connect your real API here, e.g.
         const res = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'},
           body: JSON.stringify({username:user.value.trim(), password:pass.value})});
         if(!res.ok) throw new Error('Invalid username or password'); */
      await new Promise(r => setTimeout(r, 1200));
      if ($('#remember').checked) { try { localStorage.setItem('upaj_user', user.value.trim()); } catch(_){} }
      toast('success', 'Welcome to UPAJ!', 'Login successful. Redirecting...');
      // window.location.href = '/dashboard';
    } catch (err){
      toast('error', 'Login failed', err.message || 'Something went wrong.');
      newCaptcha();
    } finally {
      btn.disabled = false; btn.classList.remove('loading'); $('#btnTxt').textContent = 'Login';
    }
  });

  $('#forgot').onclick = e => { e.preventDefault(); toast('info', 'Forgot password?', 'Please contact your UPAJ administrator to reset it.'); };

  try { const s = localStorage.getItem('upaj_user'); if (s){ user.value = s; $('#remember').checked = true; } } catch(_){}
})();
</script>
</body>
</html>
